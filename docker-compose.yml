name: parallax

services:
  api:
    build:
      context: .
      target: backend-base
    command: ["sh", "-c", "alembic upgrade head && uvicorn parallax_backend.main:app --host 0.0.0.0 --port 8000"]
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://parallax:parallax@postgres:5432/parallax
      REDIS_URL: redis://redis:6379/0
      AGENT_SERVICE_URL: http://agent:8100
      AGENT_MODE: service
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      agent:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: .
      target: backend-base
    command: ["arq", "parallax_backend.worker.WorkerSettings"]
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://parallax:parallax@postgres:5432/parallax
      REDIS_URL: redis://redis:6379/0
      AGENT_SERVICE_URL: http://agent:8100
      AGENT_MODE: service
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      agent:
        condition: service_healthy
    restart: unless-stopped

  agent:
    build:
      context: .
      target: agent-runner
    env_file:
      - path: .env
        required: false
    environment:
      AGENT_PORT: 8100
    ports:
      - "8100:8100"
    restart: unless-stopped

  frontend:
    build:
      context: .
      target: frontend-runner
    environment:
      PARALLAX_API_URL: http://api:8000
      PARALLAX_DISABLE_AUTH: "false"
      PARALLAX_DISABLE_RBAC: "false"
      PARALLAX_COOKIE_SECURE: "false"
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: parallax
      POSTGRES_PASSWORD: parallax
      POSTGRES_DB: parallax
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U parallax -d parallax"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  prometheus:
    image: prom/prometheus:v3.1.0
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    ports:
      - "9090:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
